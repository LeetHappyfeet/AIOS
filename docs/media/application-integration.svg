<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="title desc">
<title id="title">Three-prong application integration</title>
<desc id="desc">Your application calls its own LLM directly and independently exchanges events and the memory HUD with AIOS. AIOS optionally uses a small LLM only for internal work. There is no proxy connection from AIOS to the customer's LLM.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c2745"/><stop offset="1" stop-color="#183b57"/></linearGradient>
<pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity=".07"/></pattern>
<marker id="llm-arrow" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1L6 4.5L1 8" fill="none" stroke="#d3b9fb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="memory-arrow" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1L6 4.5L1 8" fill="none" stroke="#93e1e9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="720" height="350" rx="24" fill="url(#bg)"/><rect width="720" height="350" rx="24" fill="url(#grid)"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="35" y="41" fill="#ffffff" fill-opacity=".58" font-size="16" letter-spacing="3">04 / THREE-PRONG INTEGRATION</text>
<!-- The customer app independently calls the customer model and AIOS. -->
<path d="M286 146L449 104" fill="none" stroke="#d3b9fb" stroke-width="3" marker-start="url(#llm-arrow)" marker-end="url(#llm-arrow)"/>
<path d="M286 222L449 263" fill="none" stroke="#93e1e9" stroke-width="3" marker-start="url(#memory-arrow)" marker-end="url(#memory-arrow)"/>
<text x="328" y="100" fill="#e6d4ff" font-size="15" font-weight="bold">MODEL I/O</text>
<text x="319" y="259" fill="#b8f6f8" font-size="15" font-weight="bold">EVENTS / HUD</text>
<rect x="35" y="111" width="247" height="148" rx="18" fill="#102e47" stroke="#91d4ec" stroke-width="2.5"/>
<rect x="53" y="128" width="60" height="47" rx="6" fill="#28627b" stroke="#99dfed" stroke-width="1.5"/>
<path d="M63 164L76 145L88 155L101 138" fill="none" stroke="#b2eced" stroke-width="2.5" stroke-linecap="round"/>
<text x="126" y="151" fill="#e1f6fc" font-size="15" font-weight="bold">CUSTOMER</text>
<text x="126" y="171" fill="#e1f6fc" font-size="15" font-weight="bold">APPLICATION</text>
<path d="M54 189H263" stroke="#ffffff" stroke-opacity=".17"/>
<text x="54" y="218" fill="#ffffff" font-size="22" font-weight="bold">Your app</text>
<text x="54" y="240" fill="#b8dce9" font-size="14">Owns the interaction</text>
<rect x="453" y="53" width="233" height="105" rx="17" fill="#322b57" stroke="#c6a5f1" stroke-width="2.5"/>
<circle cx="481" cy="81" r="8" fill="#caa8f5"/>
<text x="498" y="87" fill="#e7d7ff" font-size="13" font-weight="bold">CUSTOMER-PROVIDED</text>
<text x="472" y="121" fill="#ffffff" font-size="25" font-weight="bold">Your LLM</text>
<text x="472" y="142" fill="#ddc9fa" font-size="14">Primary generation</text>
<rect x="453" y="203" width="233" height="124" rx="17" fill="#154e64" stroke="#7fd9e3" stroke-width="2.5"/>
<circle cx="481" cy="231" r="8" fill="#87e1e8"/>
<text x="498" y="237" fill="#c7f6f7" font-size="13" font-weight="bold">SEPARATE SERVICE</text>
<text x="472" y="270" fill="#ffffff" font-size="25" font-weight="bold">AIOS</text>
<text x="472" y="290" fill="#c7f6f7" font-size="16">Memory pipeline</text>
<text x="472" y="311" fill="#c7f6f7" font-size="13">Small LLM: internal work</text>
</g>
</svg>