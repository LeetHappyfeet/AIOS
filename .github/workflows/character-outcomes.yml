name: character-outcomes
on:
  push:
    branches: [AIOS-development]
  pull_request:
    branches: [AIOS-development]
jobs:
  outcomes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aios
          POSTGRES_PASSWORD: aios
          POSTGRES_DB: outcome_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aios"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest pytest-asyncio asyncpg requests qdrant-client pydantic python-dotenv fastapi beautifulsoup4
      - name: Check outcome transactions and shadow appraisal
        env:
          AIOS_DB_DSN: postgresql://aios:aios@127.0.0.1:5432/outcome_tests
          AIOS_OUTCOME_TEST_DSN: postgresql://aios:aios@127.0.0.1:5432/outcome_tests
        run: |
          mkdir -p "$RUNNER_TEMP/aios-pythonpath"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/aios-pythonpath/aios_app"
          PYTHONPATH="$RUNNER_TEMP/aios-pythonpath" python -m aios_app.migrate
          PYTHONPATH="$RUNNER_TEMP/aios-pythonpath" python -m aios_app.migrate
          PYTHONPATH="$RUNNER_TEMP/aios-pythonpath" python -m pytest -q \
            tests/test_character_outcomes_postgres.py \
            tests/test_shadow_reinforcement.py \
            tests/test_agent_goals.py \
            tests/test_cognitive_lifecycle.py \
            tests/test_agent_temporal.py \
            tests/test_scene_state.py \
            tests/test_scene_convergence.py \
            tests/test_cognitive_control_boundary.py \
            tests/test_world_resolution.py \
            tests/test_explicit_world_continuity.py \
            tests/test_source_goal_formation_receipt.py \
            tests/test_corpus_research.py \
            tests/test_cognitive_recall_selection.py
