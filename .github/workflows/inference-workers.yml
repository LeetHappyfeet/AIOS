name: inference-workers
on:
  push:
    branches: [AIOS-development]
    paths: ['inference/**', 'ui/tabs/inference_workers.py', 'tests/test_inference*', '.github/workflows/inference-workers.yml']
  pull_request:
    paths: ['inference/**', 'ui/tabs/inference_workers.py', 'tests/test_inference*', '.github/workflows/inference-workers.yml']
jobs:
  provider-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest asyncpg gradio python-dotenv
      - name: Validate provider requests, truncation and worker controls
        run: |
          mkdir -p "$RUNNER_TEMP/aios-pythonpath"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/aios-pythonpath/aios_app"
          PYTHONPATH="$RUNNER_TEMP/aios-pythonpath" python -m pytest -q \
            tests/test_inference_completions.py \
            tests/test_inference_workers_ui.py \
            tests/test_inference_source_coordinate.py
