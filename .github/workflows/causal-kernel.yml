name: causal-kernel

on:
  push:
    branches: [AIOS-development]
  pull_request:
    branches: [AIOS-development]

jobs:
  causal-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install narrow test dependencies
        run: python -m pip install --disable-pip-version-check pytest asyncpg
      - name: Compile changed architecture modules
        run: |
          python -m py_compile \
            causal/__init__.py \
            causal/types.py \
            causal/domain.py \
            causal/registry.py \
            causal/rules.py \
            causal/kernel.py \
            causal/ingress.py \
            causal/projection.py \
            causal/semantic_bridge.py \
            causal/domains/location.py \
            causal/domains/scalar.py \
            world/runtime.py \
            hud/context.py
      - name: Run causal and separation tests
        run: |
          mkdir -p "$RUNNER_TEMP/aios-pythonpath"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/aios-pythonpath/aios_app"
          PYTHONPATH="$RUNNER_TEMP/aios-pythonpath" \
            python -m pytest -q tests/test_causal_domains.py tests/test_causal_separation.py

  migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aios
          POSTGRES_PASSWORD: aios
          POSTGRES_DB: aiosdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aios -d aiosdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install migration dependencies
        run: python -m pip install --disable-pip-version-check asyncpg pydantic python-dotenv
      - name: Apply base schema and all migrations
        env:
          AIOS_DB_DSN: postgresql://aios:aios@127.0.0.1:5432/aiosdb
        run: |
          mkdir -p "$RUNNER_TEMP/aios-pythonpath"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/aios-pythonpath/aios_app"
          PYTHONPATH="$RUNNER_TEMP/aios-pythonpath" python -m aios_app.migrate
      - name: Verify causal schema exists
        env:
          AIOS_DB_DSN: postgresql://aios:aios@127.0.0.1:5432/aiosdb
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg
          import os

          async def main():
              conn = await asyncpg.connect(os.environ['AIOS_DB_DSN'])
              try:
                  names = await conn.fetch(
                      """
                      SELECT table_name
                      FROM information_schema.tables
                      WHERE table_schema='aios'
                        AND table_name IN ('causal_candidate','causal_admission','causal_state')
                      ORDER BY table_name
                      """
                  )
                  assert [row['table_name'] for row in names] == [
                      'causal_admission', 'causal_candidate', 'causal_state'
                  ]
                  cols = await conn.fetch(
                      """
                      SELECT column_name
                      FROM information_schema.columns
                      WHERE table_schema='aios'
                        AND table_name='world_event'
                        AND column_name IN ('candidate_id','domain_id','result_state_version')
                      ORDER BY column_name
                      """
                  )
                  assert [row['column_name'] for row in cols] == [
                      'candidate_id', 'domain_id', 'result_state_version'
                  ]
              finally:
                  await conn.close()

          asyncio.run(main())
          PY
