name: Entity memory RDF
on:
  push:
    paths: ['corpus_catalog.py', 'ui/tabs/knowledge_domains.py', 'topic_atlas/research_dossier.py', 'tests/test_corpus_reclassification_postgres.py', 'tests/test_contextual_corpus_postgres.py', 'tests/test_goal_knowledge_dependencies.py', 'entity_memory/**', 'corpus_rdf/**', 'tests/test_corpus_reference_rdf.py', 'epistemic/**', 'agent/**', 'hud/**', 'tests/test_rdf_recall*', 'tests/test_goal_planning*', 'tests/test_retrieval_prewarm.py', 'tests/test_hud.py', 'tests/test_character_inquiry.py', 'semantic_index/cli.py', 'migrations/current/**', 'tests/test_entity_memory*', '.github/workflows/entity-memory.yml']
  pull_request:
    paths: ['corpus_catalog.py', 'ui/tabs/knowledge_domains.py', 'topic_atlas/research_dossier.py', 'tests/test_corpus_reclassification_postgres.py', 'tests/test_contextual_corpus_postgres.py', 'tests/test_goal_knowledge_dependencies.py', 'entity_memory/**', 'corpus_rdf/**', 'tests/test_corpus_reference_rdf.py', 'epistemic/**', 'agent/**', 'hud/**', 'tests/test_rdf_recall*', 'tests/test_goal_planning*', 'tests/test_retrieval_prewarm.py', 'tests/test_hud.py', 'tests/test_character_inquiry.py', 'semantic_index/cli.py', 'migrations/current/**', 'tests/test_entity_memory*', '.github/workflows/entity-memory.yml']
jobs:
  entity-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest pytest-asyncio asyncpg requests pydantic python-dotenv 'spacy>=3.7,<4' rdflib qdrant-client fastapi beautifulsoup4 lxml
      - run: python -m spacy download en_core_web_sm
      - run: npm install --prefix "$RUNNER_TEMP/pglite" @electric-sql/pglite@0.5.10 --no-audit --no-fund
      - name: Verify cached extraction and RDF lifecycle
        run: |
          mkdir -p "$RUNNER_TEMP/pythonpath"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/pythonpath/aios_app"
          AIOS_PGLITE_MODULE="$RUNNER_TEMP/pglite/node_modules/@electric-sql/pglite/dist/index.js" \
          PYTHONPATH="$RUNNER_TEMP/pythonpath" python -m pytest -q \
            tests/test_entity_memory.py tests/test_entity_memory_postgres.py \
            tests/test_corpus_reference_rdf.py \
            tests/test_corpus_catalog.py tests/test_corpus_reclassification_postgres.py \
            tests/test_contextual_corpus_postgres.py tests/test_goal_knowledge_dependencies.py \
            tests/test_linguistic_projection.py tests/test_semantic_frames.py \
            tests/test_migration_transaction_contract.py \
            tests/test_rdf_recall_postgres.py tests/test_goal_planning.py \
            tests/test_goal_planning_postgres.py tests/test_retrieval_prewarm.py \
            tests/test_hud.py tests/test_character_inquiry.py
