name: Cognitive episode recovery
on:
  push:
    paths: ['agent/**', 'db.py', 'migrate.py', 'migrations/current/**', 'tests/*cognit*', '.github/workflows/cognitive-episode-recovery.yml']
  pull_request:
    paths: ['agent/**', 'db.py', 'migrate.py', 'migrations/current/**', 'tests/*cognit*', '.github/workflows/cognitive-episode-recovery.yml']
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest pytest-asyncio asyncpg requests qdrant-client pydantic python-dotenv fastapi beautifulsoup4 lxml spacy
      - run: npm install --prefix "$RUNNER_TEMP/pglite" @electric-sql/pglite@0.5.9 --no-audit --no-fund
      - name: Verify atomic boundaries, migration, episode completion, and recovery
        run: |
          mkdir -p "$RUNNER_TEMP/pythonpath"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/pythonpath/aios_app"
          AIOS_PGLITE_MODULE="$RUNNER_TEMP/pglite/node_modules/@electric-sql/pglite/dist/index.js" \
          PYTHONPATH="$RUNNER_TEMP/pythonpath" python -m pytest -q \
            tests/test_goal_planning.py \
            tests/test_goal_planning_postgres.py \
            tests/test_cognitive_job_identity.py \
            tests/test_cognitive_episode_postgres.py \
            tests/test_cognition_atomic_boundaries.py \
            tests/test_autonomy_scheduling_recovery.py \
            tests/test_cognitive_opportunity_serialization.py \
            tests/test_agent_temporal.py \
            tests/test_cognitive_lifecycle.py \
            tests/test_task_cognitive_continuations.py \
            tests/test_cognitive_control_boundary.py \
            tests/test_migration_transaction_contract.py
