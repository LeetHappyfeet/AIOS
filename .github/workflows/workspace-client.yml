name: workspace-client
on:
  push:
    branches: [AIOS-development, client-workspace-support, workspace-verification]
  pull_request:
    branches: [AIOS-development, client-workspace-support]
jobs:
  contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aios
          POSTGRES_PASSWORD: aios
          POSTGRES_DB: aios_workspace_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aios"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest pytest-asyncio asyncpg requests qdrant-client pydantic python-dotenv fastapi httpx beautifulsoup4 lxml
      - name: Validate workspace contract and migration
        env:
          AIOS_WORKSPACE_TEST_DSN: postgresql://aios:aios@127.0.0.1:5432/aios_workspace_test
        run: |
          mkdir -p "$RUNNER_TEMP/aios-pythonpath"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/aios-pythonpath/aios_app"
          PYTHONPATH="$RUNNER_TEMP/aios-pythonpath" python -m pytest -q tests/test_launch_config.py tests/test_work_admission.py tests/test_workspace_client.py tests/test_character_environments.py tests/test_environment_hud_context.py tests/test_agent_capabilities.py
