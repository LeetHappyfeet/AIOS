name: semantic-topology-coalescing

on:
  push:
    branches: [AIOS-development]
  pull_request:
    branches: [AIOS-development]

jobs:
  topology-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install narrow dependencies
        run: python -m pip install --disable-pip-version-check pytest asyncpg requests qdrant-client pydantic python-dotenv
      - name: Compile coalescing/readiness modules
        run: |
          python -m py_compile \
            epistemic/topology_projection.py \
            epistemic/belief_reconciliation.py \
            epistemic/__init__.py \
            hud/readiness.py \
            hud/retrieval.py \
            world/__init__.py \
            pipeline/job_registry.py \
            runner_v2.py \
            launch.py
      - name: Run readiness, projection, and belief tests
        run: |
          mkdir -p "$RUNNER_TEMP/aios-pythonpath"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/aios-pythonpath/aios_app"
          PYTHONPATH="$RUNNER_TEMP/aios-pythonpath" \
            python -m pytest -q \
              tests/test_hud_readiness.py \
              tests/test_topology_projection_coalescing.py \
              tests/test_belief_reconciliation.py \
              tests/test_topology_retrieval.py

  migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aios
          POSTGRES_PASSWORD: aios
          POSTGRES_DB: aiosdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aios -d aiosdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install asyncpg
        run: python -m pip install --disable-pip-version-check asyncpg
      - name: Apply semantic projection migration fixture
        env:
          AIOS_DB_DSN: postgresql://aios:aios@127.0.0.1:5432/aiosdb
        run: |
          python - <<'PY'
          import asyncio
          import os
          from pathlib import Path
          import asyncpg

          BOOTSTRAP = r'''
          CREATE SCHEMA aios;
          CREATE TABLE aios.pipeline_job (
              job_id uuid DEFAULT gen_random_uuid() PRIMARY KEY,
              job_type text NOT NULL,
              payload jsonb NOT NULL DEFAULT '{}'::jsonb,
              status text NOT NULL DEFAULT 'queued'
          );
          '''

          async def main():
              conn = await asyncpg.connect(os.environ['AIOS_DB_DSN'])
              try:
                  await conn.execute(BOOTSTRAP)
                  await conn.execute(
                      Path('migrations/20260911_zzz_semantic_scope_projection.sql')
                      .read_text(encoding='utf-8')
                  )
                  row = await conn.fetchrow(
                      """
                      SELECT EXISTS (
                          SELECT 1
                          FROM information_schema.tables
                          WHERE table_schema='aios'
                            AND table_name='semantic_scope_projection_state'
                      ) AS present
                      """
                  )
                  assert bool(row['present'])
                  await conn.execute(
                      """
                      INSERT INTO aios.pipeline_job(job_type,payload,status)
                      VALUES ('project_semantic_scope','{"scope_key":"char:test"}'::jsonb,'queued')
                      """
                  )
                  try:
                      await conn.execute(
                          """
                          INSERT INTO aios.pipeline_job(job_type,payload,status)
                          VALUES ('project_semantic_scope','{"scope_key":"char:test"}'::jsonb,'running')
                          """
                      )
                  except asyncpg.UniqueViolationError:
                      pass
                  else:
                      raise AssertionError('active scope projection uniqueness was not enforced')
              finally:
                  await conn.close()

          asyncio.run(main())
          PY

  belief-migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aios
          POSTGRES_PASSWORD: aios
          POSTGRES_DB: aiosdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aios -d aiosdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install migration dependencies
        run: python -m pip install --disable-pip-version-check asyncpg pydantic python-dotenv
      - name: Apply full AIOS migration chain
        env:
          AIOS_DB_DSN: postgresql://aios:aios@127.0.0.1:5432/aiosdb
        run: |
          mkdir -p "$RUNNER_TEMP/aios-pythonpath"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/aios-pythonpath/aios_app"
          PYTHONPATH="$RUNNER_TEMP/aios-pythonpath" python migrate.py
      - name: Verify belief reconciliation schema
        env:
          AIOS_DB_DSN: postgresql://aios:aios@127.0.0.1:5432/aiosdb
        run: |
          python - <<'PY'
          import asyncio
          import os
          import asyncpg

          async def main():
              conn = await asyncpg.connect(os.environ['AIOS_DB_DSN'])
              try:
                  checks = {
                      'semantic_atom': await conn.fetchval("SELECT to_regclass('aios.semantic_atom') IS NOT NULL"),
                      'semantic_evidence_admission': await conn.fetchval("SELECT to_regclass('aios.semantic_evidence_admission') IS NOT NULL"),
                      'character_belief_state': await conn.fetchval("SELECT to_regclass('aios.character_belief_state') IS NOT NULL"),
                      'active_belief_view': await conn.fetchval("SELECT to_regclass('aios.character_active_proposition_knowledge') IS NOT NULL"),
                      'reconcile_function': await conn.fetchval("SELECT to_regprocedure('aios.reconcile_character_belief_atom(uuid,uuid)') IS NOT NULL"),
                      'scope_projection_ledger': await conn.fetchval("SELECT to_regclass('aios.semantic_scope_projection_state') IS NOT NULL"),
                  }
                  missing = [name for name, present in checks.items() if not present]
                  if missing:
                      raise AssertionError(f'missing belief reconciliation schema objects: {missing}')

                  applied = await conn.fetch(
                      """
                      SELECT migration_name
                      FROM aios.schema_migration
                      WHERE migration_name LIKE '20260911_zzzz_0%belief%'
                         OR migration_name LIKE '20260911_zzzz_01_semantic_atom_admission.sql'
                      ORDER BY migration_name
                      """
                  )
                  names = [row['migration_name'] for row in applied]
                  expected = {
                      '20260911_zzzz_01_semantic_atom_admission.sql',
                      '20260911_zzzz_02_character_belief_state.sql',
                      '20260911_zzzz_03_belief_refresh_projection.sql',
                      '20260911_zzzz_04_belief_backfill.sql',
                      '20260911_zzzz_05_belief_rdf_reprojection.sql',
                  }
                  absent = sorted(expected.difference(names))
                  if absent:
                      raise AssertionError(f'belief migrations not recorded: {absent}')
              finally:
                  await conn.close()

          asyncio.run(main())
          PY
